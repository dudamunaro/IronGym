<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastro de Instrutor - Iron Gym</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/cadastro-instrutor.css">
</head>

<body>

  <header class="cabecalho-cadastro">
    <a href="index.html" class="link-voltar">Voltar</a>
    <a href="index.html" class="marca">
      <img src="assets/img/ironlogo.png" alt="Iron Gym">
    </a>
  </header>


  <main class="pagina-cadastro">

    <section class="cartao-cadastro">

      <p class="chamada">Cadastro de Instrutor</p>

      <h1>
        Faça parte da equipe
        <span>Iron Gym</span>!
      </h1>


      <form action="#" method="post">
        <div id="status-formulario" class="status-formulario" role="status" aria-live="polite"></div>

        <div class="formulario-duas-colunas">


          <div class="coluna-formulario">

            <h2>Dados pessoais</h2>


            <label for="nome">
              Nome completo <span>*</span>
            </label>

            <input
              type="text"
              id="nome"
              name="nome"
              placeholder="Digite o nome completo"
              minlength="3"
              maxlength="100"
              pattern="[A-Za-zÀ-ÖØ-öø-ÿ ]{3,100}"
              title="Informe um nome com pelo menos 3 caracteres."
              required
            >


            <label for="cpf">
              CPF <span>*</span>
            </label>

            <input
              type="text"
              id="cpf"
              name="cpf"
              placeholder="000.000.000-00"
              pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
              title="Informe o CPF no formato 000.000.000-00."
              required
            >


            <label for="nascimento">
              Data de nascimento <span>*</span>
            </label>

            <input
              type="date"
              id="nascimento"
              name="nascimento"
              required
            >


            <label for="sexo">
              Sexo
            </label>

            <select id="sexo" name="sexo">

              <option value="">
                Selecione
              </option>

              <option value="feminino">
                Feminino
              </option>

              <option value="masculino">
                Masculino
              </option>

              <option value="outro">
                Outro
              </option>

              <option value="nao-informar">
                Prefiro não informar
              </option>

            </select>


            <label for="email">
              E-mail <span>*</span>
            </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="Digite o e-mail"
              required
            >


            <label for="telefone">
              Telefone <span>*</span>
            </label>

            <input
              type="tel"
              id="telefone"
              name="telefone"
              placeholder="(18) 99999-9999"
              pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}"
              title="Informe o telefone no formato (18) 99999-9999."
              required
            >


            <label for="cep">
              CEP
            </label>

            <input
              type="text"
              id="cep"
              name="cep"
              placeholder="00000-000"
              pattern="[0-9]{5}-[0-9]{3}"
              title="Informe o CEP no formato 00000-000."
            >


            <div class="linha-campos">

              <div class="campo">

                <label for="cidade-academia">
                  Unidade da academia
                </label>

                <input
                  type="text"
                  id="cidade-academia"
                  name="cidade_academia"
                  value="Presidente Prudente - SP"
                  readonly
                >

              </div>

            </div>

          </div>



          <div class="coluna-formulario">

            <h2>Dados profissionais</h2>


            <label for="cref">
              Número do CREF <span>*</span>
            </label>

            <input
              type="text"
              id="cref"
              name="cref"
              placeholder="Ex: 123456-G/SP"
              pattern="[0-9]{4,6}-[A-Za-z]/[A-Za-z]{2}"
              title="Informe o CREF no formato 123456-G/SP."
              required
            >

            <label for="cnpj">
              CNPJ da empresa (opcional)
            </label>
            <input
              type="text"
              id="cnpj"
              name="cnpj"
              placeholder="00.000.000/0000-00"
              inputmode="numeric"
              maxlength="18"
            >

            <label for="data-inicio">
              Data disponível para início <span>*</span>
            </label>
            <input
              type="date"
              id="data-inicio"
              name="data_inicio"
              required
            >


            <label for="especialidade">
              Especialidade <span>*</span>
            </label>

            <select
              id="especialidade"
              name="especialidade"
              required
            >

              <option value="">
                Selecione
              </option>

              <option value="musculacao">
                Musculação
              </option>

              <option value="fisiculturismo">
                Fisiculturismo
              </option>

              <option value="funcional">
                Treino funcional
              </option>

              <option value="reabilitacao">
                Recuperação e reabilitação
              </option>

              <option value="personal">
                Personal trainer
              </option>

            </select>


            <label for="formacao">
              Formação
            </label>

            <input
              type="text"
              id="formacao"
              name="formacao"
              placeholder="Ex: Educação Física"
              minlength="3"
              maxlength="100"
              pattern="[A-Za-zÀ-ÖØ-öø-ÿ0-9 .,&/-]{3,100}"
              title="Informe uma formação válida."
            >


            <label for="experiencia">
              Tempo de experiência
            </label>

            <select id="experiencia" name="experiencia">

              <option value="">
                Selecione
              </option>

              <option value="menos-1">
                Menos de 1 ano
              </option>

              <option value="1-2">
                1 a 2 anos
              </option>

              <option value="3-5">
                3 a 5 anos
              </option>

              <option value="mais-5">
                Mais de 5 anos
              </option>

            </select>


            <label for="horario">
              Horário disponível
            </label>

            <select id="horario" name="horario">

              <option value="">
                Selecione
              </option>

              <option value="manha">
                Manhã
              </option>

              <option value="tarde">
                Tarde
              </option>

              <option value="noite">
                Noite
              </option>

              <option value="integral">
                Período integral
              </option>

            </select>


            <label for="observacoes">
              Informações adicionais
            </label>

            <textarea
              id="observacoes"
              name="observacoes"
              placeholder="Informe sua experiência profissional, público atendido ou disponibilidade especial"
              maxlength="500"
            ></textarea>

          </div>

        </div>

        <section class="tabela-candidatura" aria-labelledby="titulo-documentos">
          <div class="cabecalho-tabela-candidatura">
            <div>
              <p class="chamada">Informações da candidatura</p>
              <h2 id="titulo-documentos">Cursos e certificações informados</h2>
            </div>
            <span id="contador-documentos" class="contador-documentos"></span>
          </div>
          <div class="linha-adicionar-documento">
            <label for="txt-texto">Adicionar curso ou certificação</label>
            <div>
              <input
                type="text"
                id="txt-texto"
                name="curso_certificacao"
                placeholder="Ex: Curso de musculação"
                maxlength="100"
              >
              <button type="button" id="btn-add" class="botao-adicionar">
                Adicionar
              </button>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table tabela-documentos align-middle mb-0">
              <thead>
                <tr>
                  <th scope="col" class="coluna-selecao">
                    <input type="checkbox" id="ckTodos" aria-label="Selecionar todos">
                  </th>
                  <th scope="col">Item</th>
                  <th scope="col" class="coluna-exclusao">Excluir</th>
                </tr>
              </thead>
              <tbody id="tb-body"></tbody>
            </table>
          </div>
          <button type="button" id="btnExcluirSelecionados" class="botao-excluir">
            Excluir itens selecionados
          </button>
          <p id="status-documentos" class="status-documentos" role="status" aria-live="polite"></p>
        </section>

        <div class="acoes-formulario">

          <button type="submit">
            Cadastrar instrutor
          </button>

        </div>

      </form>


      <a href="login-profissional.html" class="link-texto">
        Já possui cadastro
      </a>

    </section>

  </main>

  <script src="assets/js/form-validations.js"></script>


</body>

</html>
