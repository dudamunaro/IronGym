<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastro de Instrutor - Iron Gym</title>

  <link rel="stylesheet" href="assets/css/cadastro-instrutor.css">
</head>

<body>

  <header class="cabecalho-cadastro">

    <a href="index.html" class="link-voltar">
      Voltar
    </a>

    <a href="index.html" class="marca">
      <img src="assets/img/logo-iron-gym.png" alt="Iron Gym">
    </a>

  </header>


  <main class="pagina-cadastro">

    <section class="cartao-cadastro">

      <p class="chamada">Cadastro de Instrutor</p>

      <h1>
        Faça parte da equipe
        <span>Iron Gym</span>!
      </h1>


      <form action="login.html" method="get">

        <div class="formulario-duas-colunas">


          <!-- COLUNA ESQUERDA -->

          <div class="coluna-formulario">

            <h2>Dados pessoais</h2>


            <label for="nome">
              Nome completo <span>*</span>
            </label>

            <input
              type="text"
              id="nome"
              name="nome"
              placeholder="Digite o nome completo"
              required
            >


            <label for="cpf">
              CPF <span>*</span>
            </label>

            <input
              type="text"
              id="cpf"
              name="cpf"
              placeholder="000.000.000-00"
              required
            >


            <label for="nascimento">
              Data de nascimento <span>*</span>
            </label>

            <input
              type="date"
              id="nascimento"
              name="nascimento"
              required
            >


            <label for="sexo">
              Sexo
            </label>

            <select id="sexo" name="sexo">

              <option value="">
                Selecione
              </option>

              <option value="feminino">
                Feminino
              </option>

              <option value="masculino">
                Masculino
              </option>

              <option value="outro">
                Outro
              </option>

              <option value="nao-informar">
                Prefiro não informar
              </option>

            </select>


            <label for="email">
              E-mail <span>*</span>
            </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="Digite o e-mail"
              required
            >


            <label for="telefone">
              Telefone <span>*</span>
            </label>

            <input
              type="tel"
              id="telefone"
              name="telefone"
              placeholder="(18) 99999-9999"
              required
            >


            <label for="cep">
              CEP
            </label>

            <input
              type="text"
              id="cep"
              name="cep"
              placeholder="00000-000"
            >


            <div class="linha-campos">

              <div class="campo">

                <label for="cidade">
                  Cidade
                </label>

                <input
                  type="text"
                  id="cidade"
                  name="cidade"
                  placeholder="Digite a cidade"
                >

              </div>


              <div class="campo">

                <label for="estado">
                  Estado
                </label>

                <select id="estado" name="estado">

                  <option value="">
                    UF
                  </option>

                  <option value="SP">SP</option>
                  <option value="PR">PR</option>
                  <option value="MS">MS</option>
                  <option value="MG">MG</option>
                  <option value="RJ">RJ</option>
                  <option value="SC">SC</option>
                  <option value="RS">RS</option>

                </select>

              </div>

            </div>

          </div>



          <!-- COLUNA DIREITA -->

          <div class="coluna-formulario">

            <h2>Dados profissionais</h2>


            <label for="cref">
              Número do CREF <span>*</span>
            </label>

            <input
              type="text"
              id="cref"
              name="cref"
              placeholder="Ex: 123456-G/SP"
              required
            >


            <label for="especialidade">
              Especialidade <span>*</span>
            </label>

            <select
              id="especialidade"
              name="especialidade"
              required
            >

              <option value="">
                Selecione
              </option>

              <option value="musculacao">
                Musculação
              </option>

              <option value="fisiculturismo">
                Fisiculturismo
              </option>

              <option value="funcional">
                Treino funcional
              </option>

              <option value="reabilitacao">
                Recuperação e reabilitação
              </option>

              <option value="personal">
                Personal trainer
              </option>

            </select>


            <label for="formacao">
              Formação
            </label>

            <input
              type="text"
              id="formacao"
              name="formacao"
              placeholder="Ex: Educação Física"
            >


            <label for="experiencia">
              Tempo de experiência
            </label>

            <select id="experiencia" name="experiencia">

              <option value="">
                Selecione
              </option>

              <option value="menos-1">
                Menos de 1 ano
              </option>

              <option value="1-2">
                1 a 2 anos
              </option>

              <option value="3-5">
                3 a 5 anos
              </option>

              <option value="mais-5">
                Mais de 5 anos
              </option>

            </select>


            <label for="horario">
              Horário disponível
            </label>

            <select id="horario" name="horario">

              <option value="">
                Selecione
              </option>

              <option value="manha">
                Manhã
              </option>

              <option value="tarde">
                Tarde
              </option>

              <option value="noite">
                Noite
              </option>

              <option value="integral">
                Período integral
              </option>

            </select>


            <label for="observacoes">
              Observações
            </label>

            <textarea
              id="observacoes"
              name="observacoes"
              placeholder="Informe cursos, certificações ou outras informações profissionais"
            ></textarea>

          </div>

        </div>


        <div class="acoes-formulario">

          <button type="submit">
            Cadastrar instrutor
          </button>

        </div>

      </form>


      <a href="login.html" class="link-texto">
        Já possui cadastro
      </a>

    </section>

  </main>

</body>

</html>
```
