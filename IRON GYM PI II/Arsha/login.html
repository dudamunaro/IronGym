<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Iron Gym</title>
  <link rel="stylesheet" href="assets/css/login.css">
  <!-- Favicons -->
  <link href="assets/img/favicon.png" rel="icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">
</head>
<body>
  <header class="cabecalho-login">
    <a href="index.html" class="marca">
      <img src="assets/img/ironlogo.png" alt="Iron Gym">
    </a>
    <nav>
      <a href="index.html">Início</a>
      <a href="index.html#pricing">Planos</a>
      <a href="index.html#faq-2">Dúvidas</a>
    </nav>
  </header>

  <main class="pagina-login">
    <section class="introducao-login">
      <p class="chamada">Iron Gym Club</p>
      <h1>Área do aluno</h1>
      <p>Acesse sua área do aluno para acompanhar matrícula, planos e treinos.</p>

      <div class="beneficios-login">
        <article>
          <strong>Treino</strong>
          <span>Ficha e acompanhamento</span>
        </article>
        <article>
          <strong>Planos</strong>
          <span>Consulta rápida</span>
        </article>
        <article>
          <strong>Suporte</strong>
          <span>Atendimento ao aluno</span>
        </article>
      </div>
    </section>

    <section class="cartao-login">
      <p class="chamada">Acesso do aluno</p>
      <h2>Entrar</h2>

      <form action="index.html" method="get">
        <label for="usuario">E-mail</label>
        <input type="text" id="usuario" name="usuario" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required>

        <div class="acoes-login">
          <button type="submit">Entrar</button>
          <a href="index.html">Cancelar</a>
        </div>
      </form>

      <a href="cadastro.html" class="link-texto">Criar cadastro</a>
    </section>
  </main>
</body>
</html>
